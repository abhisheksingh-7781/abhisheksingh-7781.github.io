name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a manual run from the Actions tab.
  workflow_dispatch:

# Least privilege needed to publish a Pages artifact.
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # NEXT_PUBLIC_API_URL comes from .env.production, which is committed.
      # It is deliberately not passed as a repository variable here: an unset
      # variable resolves to an empty string, and an empty value set in the
      # environment silently shadows the .env file rather than falling back to
      # it — which would deploy the contact form in "not connected" mode.
      - name: Build static site
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
